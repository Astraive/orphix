services:
  # ── Databases ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: orphix-postgres
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: orphix
      POSTGRES_USER: orphix
      POSTGRES_PASSWORD: orphix_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orphix -d orphix"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orphix-redis
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── APIs ──────────────────────────────────────────────
  control:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: run-control
    container_name: orphix-control
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "2605:2605"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "2605"
      DATABASE_URL: "postgres://orphix:orphix_dev@postgres:5432/orphix"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "${JWT_SECRET}"
      TOKEN_ENCRYPTION_KEY: "${TOKEN_ENCRYPTION_KEY}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET}"
      GITHUB_REDIRECT_URI: "${GITHUB_REDIRECT_URI}"
      CORS_ORIGINS: "${CORS_ORIGINS}"
      ALLOWED_REDIRECT_URIS: "${ALLOWED_REDIRECT_URIS}"
      SPA_ORIGIN: "${SPA_ORIGIN}"
      LINK_API_URL: "http://link:2606"
      MARKETPLACE_API_URL: "http://marketplace:2607"

  link:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: run-link
    container_name: orphix-link
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "2606:2606"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "2606"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgres://orphix:orphix_dev@postgres:5432/orphix"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "${JWT_SECRET}"
      CORS_ORIGINS: "${CORS_ORIGINS}"
      CONTROL_API_URL: "http://control:2605"

  # ── Web App ──────────────────────────────────────────
  # web:
  #   build:
  #     context: ../..
  #     dockerfile: Dockerfile
  #     target: run-web
