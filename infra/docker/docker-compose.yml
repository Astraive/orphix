  #       VITE_APP_URL: "http://localhost:3000"
  #   container_name: orphix-web
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     control:
  #       condition: service_started

volumes:
  pgdata:
  redisdata:
