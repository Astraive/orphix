# Orphix Databases — All 3 services combined
# Run: docker compose -f databases/docker-compose.yml up -d

services:
  # ── Public Postgres (users, auth, devices, notes) ─────
  postgres:
    image: postgres:16-alpine
    container_name: orphix-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: orphix
      POSTGRES_USER: orphix
      POSTGRES_PASSWORD: orphix_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../infra/docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orphix -d orphix"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ── Private Postgres (internal/secrets) ───────────────
  postgres-private:
    image: postgres:16-alpine
    container_name: orphix-postgres-private
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: orphix_private
      POSTGRES_USER: orphix
      POSTGRES_PASSWORD: orphix_dev
    volumes:
      - pgdata-private:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orphix -d orphix_private"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ── Redis ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: orphix-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  pgdata-private:
  redisdata:
