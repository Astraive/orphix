services:
  postgres:
    image: postgres:16-alpine
    container_name: orphix-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: orphix
      POSTGRES_USER: orphix
      POSTGRES_PASSWORD: orphix_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../infra/docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orphix -d orphix"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
