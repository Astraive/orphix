[package]
name = "orphix-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "orphix-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
orphix-git = { path = "../orphix-git" }
orphix-fs = { path = "../orphix-fs" }
orphix-docker = { path = "../orphix-docker" }
orphix-link = { path = "../orphix-link" }
reqwest = { version = "0.12", features = ["json"] }
